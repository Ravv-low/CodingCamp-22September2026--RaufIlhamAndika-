<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="style.css">
  <!-- CDN Chart.js untuk membuat grafik -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="container">
    <h1>Expense & Budget Visualizer</h1>

    <!-- 1. Total Balance -->
    <div class="balance-card">
      <h2>Total Pengeluaran:</h2>
      <p id="total-balance">Rp 0</p>
    </div>

    <div class="main-content">
      <!-- 2. Form Input Transaksi -->
      <div class="card">
        <h3>Tambah Transaksi</h3>
        <form id="expense-form">
          <div class="form-group">
            <label for="item-name">Nama Barang / Transaksi</label>
            <input type="text" id="item-name" placeholder="Misal: Nasi Goreng" required>
          </div>

          <div class="form-group">
            <label for="item-amount">Jumlah (Rp)</label>
            <input type="number" id="item-amount" placeholder="Misal: 20000" min="1" required>
          </div>

          <div class="form-group">
            <label for="item-category">Kategori</label>
            <select id="item-category" required>
              <option value="" disabled selected>Pilih Kategori</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>

          <button type="submit" id="btn-submit">Tambah</button>
        </form>
      </div>

      <!-- 3. Visual Chart -->
      <div class="card">
        <h3>Persentase Pengeluaran</h3>
        <div class="chart-container">
          <canvas id="expense-chart"></canvas>
        </div>
      </div>
    </div>

    <!-- 4. Daftar Transaksi -->
    <div class="card margin-top">
      <h3>Daftar Transaksi</h3>
      <div class="table-scroll">
        <table id="transaction-table">
          <thead>
            <tr>
              <th>Nama</th>
              <th>Nominal</th>
              <th>Kategori</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="transaction-list">
            <!-- Data transaksi akan muncul di sini via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
