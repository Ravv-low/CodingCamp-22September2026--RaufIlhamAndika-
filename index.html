<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Expense & Budget Visualizer</h1>
      <button id="theme-toggle" class="btn-theme">🌙 Dark Mode</button>
    </header>

    <div class="total-card">
      <h2>Total Pengeluaran</h2>
      <p id="total-balance">Rp 0</p>
    </div>

    <div class="grid">
      <div class="card">
        <h3>Tambah Transaksi</h3>
        <form id="expense-form">
          <label for="item-name">Nama Barang / Transaksi</label>
          <input type="text" id="item-name" placeholder="Misal: Nasi Goreng" required>

          <label for="item-amount">Jumlah (Rp)</label>
          <input type="number" id="item-amount" placeholder="Misal: 20000" required>

          <label for="item-category">Kategori</label>
          <select id="item-category" required>
            <option value="">Pilih Kategori</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>

          <button type="submit" class="btn-submit">Tambah</button>
        </form>
      </div>

      <div class="card">
        <h3>Persentase Pengeluaran</h3>
        <div class="chart-container">
          <canvas id="expense-chart"></canvas>
        </div>
      </div>
    </div>

    <div class="card list-card">
      <div class="list-header">
        <h3>Daftar Transaksi</h3>
        <div class="sort-container">
          <label for="sort-select">Urutkan: </label>
          <select id="sort-select">
            <option value="default">Default</option>
            <option value="high-low">Nominal Terbesar</option>
            <option value="low-high">Nominal Terkecil</option>
          </select>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Nama</th>
            <th>Nominal</th>
            <th>Kategori</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="transaction-list"></tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
